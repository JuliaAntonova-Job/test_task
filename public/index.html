<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Пока грузится</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Пока грузится</h1>
    <p><span id="status">Нажмите кнопку, чтобы запустить задачу</span> <span id="timer"></span></p>

    <button id="start-btn">Начать задачу</button>

    <div id="game-field">
      <div id="basket"></div>
    </div>

    <p id="hint">Ловите звёзды корзиной — стрелки ← →</p>
    <p id="lives">Жизни: 3</p>
  </main>

  <div id="lose-modal" class="modal-overlay" hidden>
    <div class="modal-content">
      <p>Вы проиграли</p>
      <p id="lose-score"></p>
      <button id="restart-round-btn" class="modal-btn">Начать сначала</button>
    </div>
  </div>

  <div id="complete-modal" class="modal-overlay" hidden>
    <div class="modal-content">
      <p>Задача выполнена ✅</p>
      <p id="complete-score"></p>
      <button id="complete-ok-btn" class="modal-btn">ОК</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
